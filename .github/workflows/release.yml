name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: make cross VERSION=${{ github.ref_name }}

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Sign checksums
        env:
          VARRO_SIGNING_KEY: ${{ secrets.VARRO_SIGNING_KEY }}
        run: go run ./tools/sign -in dist/checksums.txt -out dist/checksums.txt.sig

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
