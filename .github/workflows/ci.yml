name: ci

# Safety net: build, vet, test, format-check, and vuln-scan on every push to
# main and every PR. Keeps the broad feature set from regressing silently.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build (host)
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: cross-build agents
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build ./... || exit 1
          done

  # Run the suite on real Windows + macOS so the platform-specific agent code
  # (ETW sensor, Windows Event Log + macOS unified-log collectors) is actually
  # exercised, not just cross-compiled.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (agent + collect + model + etw on this OS)
        run: go test -count=1 ./internal/collect/... ./internal/agent/... ./internal/model/... ./internal/etw/...
      # Exercise the real ETW session on Windows (opt-in path). Non-blocking:
      # surfaces struct-layout / syscall problems without failing the whole run
      # while the sensor is experimental.
      - name: ETW session smoke (Windows, opt-in)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        env:
          VARRO_ETW: '1'
        run: go test -count=1 -run ETWExercise ./internal/etw/...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
